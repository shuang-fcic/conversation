services:
  ms-conversations-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runner

    # Keep dev and prod builds from overwriting the same local image tag.
    image: ms-conversations-backend:prod

    restart: always

    environment:
      - ENV_PRODUCTION=true
      - NODE_ENV=production

    ports:
      - "6114:3000"

    env_file:
      - .env

    # Makes `docker compose up --wait` fail on a crash loop.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    volumes:
      - /var/docker/logs/ms-conversations:/app/logs
      - /var/docker/data/ms-conversations/documents:/storage/documents
